name: sharplabnext

x-service-environment: &service-environment
  ASPNETCORE_URLS: http://+:8080
  ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
  InternalServiceAuth__Required: "true"
  InternalServiceAuth__TokenFile: /run/secrets/sharplabnext-internal-service-token

x-service-defaults: &service-defaults
  restart: unless-stopped
  pull_policy: never
  init: true
  read_only: true
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  networks:
    - control
  environment: *service-environment
  secrets:
    - source: internal-service-token
      target: sharplabnext-internal-service-token

services:
  gateway:
    <<: *service-defaults
    image: ${SHARPLABNEXT_GATEWAY_IMAGE:-sharplabnext/gateway:0.1.0-dev.1}
    ports:
      - "${SHARPLABNEXT_BIND_ADDRESS:-127.0.0.1}:${SHARPLABNEXT_HTTP_PORT:-8080}:8080"
    networks:
      - public
      - control
      - cppcli-control
      - jsharp-control
    depends_on:
      artifact-store:
        condition: service_started
      runtime-supervisor:
        condition: service_started
      worker-roslyn-stable:
        condition: service_started
      worker-roslyn-netfx48:
        condition: service_started
      worker-roslyn-main:
        condition: service_started
      worker-roslyn-const-generics:
        condition: service_started
      worker-fsharp:
        condition: service_started
      worker-gsharp:
        condition: service_started
      worker-peachpie:
        condition: service_started
      worker-cppcli:
        condition: service_started
      worker-jsharp:
        condition: service_started
      worker-il:
        condition: service_started
      worker-minilang:
        condition: service_started
      worker-artifacts-default:
        condition: service_started
      worker-artifacts-jsil:
        condition: service_started
      worker-artifacts-const-generics:
        condition: service_started
      worker-artifacts-il-assembler:
        condition: service_started
    environment:
      <<: *service-environment
      OperationExecution__WorkerConcurrency: "8"
      ProfileUpdates__StatusPath: /app/config/profile-update-status.json
      GitHub__OAuth__Enabled: "${SHARPLABNEXT_GITHUB_OAUTH_ENABLED:-false}"
      GitHub__OAuth__ClientId: "${SHARPLABNEXT_GITHUB_OAUTH_CLIENT_ID:-}"
      GitHub__OAuth__CallbackUri: "${SHARPLABNEXT_GITHUB_OAUTH_CALLBACK_URI:-}"
      GitHub__OAuth__ClientSecretFile: /run/secrets/sharplabnext-github-oauth-client-secret
      Services__LanguageWorkers__roslyn-stable__BaseAddress: http://worker-roslyn-stable:8080
      Services__LanguageWorkers__roslyn-stable__ExpectedWorkerImageId: ${SHARPLABNEXT_ROSLYN_STABLE_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__roslyn-stable-netfx48__BaseAddress: http://worker-roslyn-netfx48:8080
      Services__LanguageWorkers__roslyn-stable-netfx48__ExpectedWorkerImageId: ${SHARPLABNEXT_ROSLYN_NETFX48_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__roslyn-main__BaseAddress: http://worker-roslyn-main:8080
      Services__LanguageWorkers__roslyn-main__ExpectedWorkerImageId: ${SHARPLABNEXT_ROSLYN_MAIN_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__roslyn-const-generics__BaseAddress: http://worker-roslyn-const-generics:8080
      Services__LanguageWorkers__roslyn-const-generics__ExpectedWorkerImageId: ${SHARPLABNEXT_ROSLYN_CONST_GENERICS_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__fsharp-stable__BaseAddress: http://worker-fsharp:8080
      Services__LanguageWorkers__fsharp-stable__ExpectedWorkerImageId: ${SHARPLABNEXT_FSHARP_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__gsharp-stable__BaseAddress: http://worker-gsharp:8080
      Services__LanguageWorkers__gsharp-stable__ExpectedWorkerImageId: ${SHARPLABNEXT_GSHARP_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__peachpie-stable__BaseAddress: http://worker-peachpie:8080
      Services__LanguageWorkers__peachpie-stable__ExpectedWorkerImageId: ${SHARPLABNEXT_PEACHPIE_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__msvc-cppcli-netfx48__BaseAddress: http://worker-cppcli:8080
      Services__LanguageWorkers__msvc-cppcli-netfx48__ExpectedWorkerImageId: ${SHARPLABNEXT_CPPCLI_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__vjc-jsharp20__BaseAddress: http://worker-jsharp:8080
      Services__LanguageWorkers__vjc-jsharp20__ExpectedWorkerImageId: ${SHARPLABNEXT_JSHARP_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__mobius-ilasm-stable__BaseAddress: http://worker-il:8080
      Services__LanguageWorkers__mobius-ilasm-stable__ExpectedWorkerImageId: ${SHARPLABNEXT_IL_WORKER_IMAGE_ID:-bundle-overlay-required}
      Services__LanguageWorkers__minilang-stable__BaseAddress: http://worker-minilang:8080
      Services__LanguageWorkers__minilang-stable__ExpectedWorkerImageId: ${SHARPLABNEXT_MINILANG_IMAGE_ID:-bundle-overlay-required}
      Services__RoslynStableWorker__BaseAddress: http://worker-roslyn-stable:8080
      Services__ArtifactStore__BaseAddress: http://artifact-store:8080
      Services__ArtifactWorkers__artifacts-default__BaseAddress: http://worker-artifacts-default:8080
      Services__ArtifactWorkers__artifacts-default__ExpectedWorkerImageId: ${SHARPLABNEXT_ARTIFACTS_DEFAULT_IMAGE_ID:-bundle-overlay-required}
      Services__ArtifactWorkers__artifacts-jsil__BaseAddress: http://worker-artifacts-jsil:8080
      Services__ArtifactWorkers__artifacts-jsil__ExpectedWorkerImageId: ${SHARPLABNEXT_ARTIFACTS_JSIL_IMAGE_ID:-bundle-overlay-required}
      Services__ArtifactWorkers__artifacts-const-generics__BaseAddress: http://worker-artifacts-const-generics:8080
      Services__ArtifactWorkers__artifacts-const-generics__ExpectedWorkerImageId: ${SHARPLABNEXT_ARTIFACTS_CONST_GENERICS_IMAGE_ID:-bundle-overlay-required}
      Services__ArtifactWorkers__il-assembler__BaseAddress: http://worker-artifacts-il-assembler:8080
      Services__ArtifactWorkers__il-assembler__ExpectedWorkerImageId: ${SHARPLABNEXT_IL_ASSEMBLER_IMAGE_ID:-bundle-overlay-required}
      Services__RuntimeSupervisor__BaseAddress: http://runtime-supervisor:8080
    secrets:
      - source: internal-service-token
        target: sharplabnext-internal-service-token
      - source: github-oauth-client-secret
        target: sharplabnext-github-oauth-client-secret
    volumes:
      - type: bind
        source: ./profile-update-status.json
        target: /app/config/profile-update-status.json
        read_only: true
        bind:
          create_host_path: false

  artifact-store:
    <<: *service-defaults
    image: ${SHARPLABNEXT_ARTIFACT_STORE_IMAGE:-sharplabnext/artifact-store:0.1.0-dev.1}
    volumes:
      - artifact-data:/var/lib/sharplabnext
    environment:
      <<: *service-environment
      ArtifactStore__RootPath: /var/lib/sharplabnext

  runtime-supervisor:
    <<: *service-defaults
    image: ${SHARPLABNEXT_RUNTIME_SUPERVISOR_IMAGE:-sharplabnext/runtime-supervisor:0.1.0-dev.1}
    group_add:
      - "${DOCKER_GID:-0}"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    environment:
      <<: *service-environment
      RuntimeSupervisor__Sandbox__AppArmorProfile: "${SHARPLABNEXT_RUNTIME_APPARMOR_PROFILE:-}"
      RuntimeSupervisor__SessionReuseEnabled: "${SHARPLABNEXT_RUNTIME_SESSION_REUSE_ENABLED:-true}"
      RuntimeSupervisor__SessionMaximumAgeSeconds: "${SHARPLABNEXT_RUNTIME_SESSION_MAXIMUM_AGE_SECONDS:-600}"
      RuntimeSupervisor__Profiles__2__Image: ${SHARPLABNEXT_CONST_GENERICS_RUNTIME_IMAGE:-sharplabnext/runtime-const-generics:development}
      RuntimeSupervisor__Profiles__2__RuntimeImageId: ${SHARPLABNEXT_CONST_GENERICS_RUNTIME_IMAGE_ID:-unverified}
      RuntimeSupervisor__Profiles__3__Image: ${SHARPLABNEXT_WINE_NETFX48_RUNTIME_IMAGE:-sharplabnext/runtime-wine-netfx48:development}
      RuntimeSupervisor__Profiles__3__RuntimeImageId: ${SHARPLABNEXT_WINE_NETFX48_RUNTIME_IMAGE_ID:-unverified}
      RuntimeSupervisor__Profiles__4__Image: ${SHARPLABNEXT_WINE_JSHARP20_RUNTIME_IMAGE:-sharplabnext/runtime-wine-jsharp20:development}
      RuntimeSupervisor__Profiles__4__RuntimeImageId: ${SHARPLABNEXT_WINE_JSHARP20_RUNTIME_IMAGE_ID:-unverified}

  worker-roslyn-stable:
    <<: *service-defaults
    image: ${SHARPLABNEXT_ROSLYN_STABLE_IMAGE:-sharplabnext/worker-roslyn-stable:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      RoslynWorker__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      RoslynWorker__WorkerImageId: ${SHARPLABNEXT_ROSLYN_STABLE_IMAGE_ID:-unverified}
      RoslynWorker__BuildProcess__MaximumConcurrentProcesses: "8"
      ArtifactStore__BaseUrl: http://artifact-store:8080
      RoslynWorker__DevelopmentArtifactEnvelope__Enabled: "false"
      ReferenceSets__net10-ref__Path: /reference-sets/net10-ref

  worker-roslyn-netfx48:
    <<: *service-defaults
    image: ${SHARPLABNEXT_ROSLYN_NETFX48_IMAGE:-sharplabnext/worker-roslyn-netfx48:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      RoslynWorker__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      RoslynWorker__WorkerImageId: ${SHARPLABNEXT_ROSLYN_NETFX48_IMAGE_ID:-unverified}
      RoslynWorker__BuildProcess__MaximumConcurrentProcesses: "8"
      ArtifactStore__BaseUrl: http://artifact-store:8080
      RoslynWorker__DevelopmentArtifactEnvelope__Enabled: "false"

  worker-roslyn-main:
    <<: *service-defaults
    image: ${SHARPLABNEXT_ROSLYN_MAIN_IMAGE:-sharplabnext/worker-roslyn-main:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      RoslynWorker__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      RoslynWorker__WorkerImageId: ${SHARPLABNEXT_ROSLYN_MAIN_IMAGE_ID:-unverified}
      RoslynWorker__BuildProcess__MaximumConcurrentProcesses: "8"
      ArtifactStore__BaseUrl: http://artifact-store:8080
      RoslynWorker__DevelopmentArtifactEnvelope__Enabled: "false"
      ReferenceSets__net10-ref__Path: /reference-sets/net10-ref
      ReferenceSets__net11-preview-ref__Path: /reference-sets/net11-preview-ref

  worker-roslyn-const-generics:
    <<: *service-defaults
    image: ${SHARPLABNEXT_ROSLYN_CONST_GENERICS_IMAGE:-sharplabnext/worker-roslyn-const-generics:development}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      RoslynWorker__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      RoslynWorker__WorkerImageId: ${SHARPLABNEXT_ROSLYN_CONST_GENERICS_IMAGE_ID:-unverified}
      RoslynWorker__BuildProcess__MaximumConcurrentProcesses: "8"
      ArtifactStore__BaseUrl: http://artifact-store:8080
      RoslynWorker__DevelopmentArtifactEnvelope__Enabled: "false"
      ReferenceSets__const-generics-ref__Path: /reference-sets/const-generics-ref

  worker-artifacts-default:
    <<: *service-defaults
    image: ${SHARPLABNEXT_ARTIFACTS_DEFAULT_IMAGE:-sharplabnext/worker-artifacts-default:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ArtifactWorker__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      ArtifactWorker__WorkerImageId: ${SHARPLABNEXT_ARTIFACTS_DEFAULT_IMAGE_ID:-unverified}

  worker-artifacts-jsil:
    <<: *service-defaults
    image: ${SHARPLABNEXT_ARTIFACTS_JSIL_IMAGE:-sharplabnext/worker-artifacts-jsil:development}
    depends_on:
      artifact-store:
        condition: service_started
    tmpfs:
      - /tmp:rw,nosuid,size=768m
    environment:
      <<: *service-environment
      Jsil__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      Jsil__WorkerImageId: ${SHARPLABNEXT_ARTIFACTS_JSIL_IMAGE_ID:-unverified}
      ArtifactStore__BaseUrl: http://artifact-store:8080

  worker-artifacts-const-generics:
    <<: *service-defaults
    image: ${SHARPLABNEXT_ARTIFACTS_CONST_GENERICS_IMAGE:-sharplabnext/worker-artifacts-const-generics:development}
    depends_on:
      artifact-store:
        condition: service_started
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    environment:
      <<: *service-environment
      ConstGenericsArtifactWorker__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      ConstGenericsArtifactWorker__WorkerImageId: ${SHARPLABNEXT_ARTIFACTS_CONST_GENERICS_IMAGE_ID:-unverified}
      ConstGenericsArtifactWorker__ProcessorDotNetHostPath: /opt/const-runtime/dotnet
      ConstGenericsArtifactWorker__ProcessorAssemblyPath: /app/processor/SharpLabNext.Worker.Artifacts.ConstGenerics.Processor.dll
      ConstGenericsArtifactWorker__ReferenceRoot: /reference-sets/const-generics-ref
      ArtifactStore__BaseUrl: http://artifact-store:8080

  worker-artifacts-il-assembler:
    <<: *service-defaults
    image: ${SHARPLABNEXT_IL_ASSEMBLER_IMAGE:-sharplabnext/worker-artifacts-il-assembler:0.1.0-dev.1}
    depends_on:
      artifact-store:
        condition: service_started
    environment:
      <<: *service-environment
      ArtifactAssembler__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      ArtifactAssembler__WorkerImageId: ${SHARPLABNEXT_IL_ASSEMBLER_IMAGE_ID:-unverified}
      ArtifactStore__BaseUrl: http://artifact-store:8080

  worker-fsharp:
    <<: *service-defaults
    image: ${SHARPLABNEXT_FSHARP_IMAGE:-sharplabnext/worker-fsharp:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      FSharpWorker__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      FSharpWorker__WorkerImageId: ${SHARPLABNEXT_FSHARP_IMAGE_ID:-unverified}
      FSharpWorker__BuildProcess__MaximumConcurrentProcesses: "8"
      ArtifactStore__BaseUrl: http://artifact-store:8080
      FSharpWorker__DevelopmentArtifactEnvelope__Enabled: "false"
      ReferenceSets__net10-ref__Path: /reference-sets/net10-ref
      ReferenceSets__net11-preview-ref__Path: /reference-sets/net11-preview-ref

  worker-gsharp:
    <<: *service-defaults
    image: ${SHARPLABNEXT_GSHARP_IMAGE:-sharplabnext/worker-gsharp:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      GSharp__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      GSharp__WorkerImageId: ${SHARPLABNEXT_GSHARP_IMAGE_ID:-unverified}
      ReferenceSets__net10-ref__Path: /reference-sets/net10-ref

  worker-peachpie:
    <<: *service-defaults
    image: ${SHARPLABNEXT_PEACHPIE_IMAGE:-sharplabnext/worker-peachpie:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      PeachPie__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      PeachPie__WorkerImageId: ${SHARPLABNEXT_PEACHPIE_IMAGE_ID:-unverified}
      PeachPie__BuildProcess__MaximumConcurrentProcesses: "8"
      ReferenceSets__net10-ref__Path: /reference-sets/net10-ref

  worker-cppcli:
    <<: *service-defaults
    image: ${SHARPLABNEXT_CPPCLI_IMAGE:-sharplabnext/worker-cppcli:0.1.0-dev.1}
    user: "0:0"
    networks:
      - cppcli-control
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
      - /opt/wine-dotnet/drive_c/users/root/Temp:rw,exec,nosuid,nodev,size=256m,mode=1777
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      CppCli__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      CppCli__WorkerImageId: ${SHARPLABNEXT_CPPCLI_IMAGE_ID:-unverified}
      CppCli__CompilerVersion: "19.51.36248"

  worker-jsharp:
    <<: *service-defaults
    image: ${SHARPLABNEXT_JSHARP_IMAGE:-sharplabnext/worker-jsharp:0.1.0-dev.1}
    user: "0:0"
    networks:
      - jsharp-control
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    ulimits:
      nofile:
        soft: 512
        hard: 512
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=64m,mode=1777
      - /opt/wine-jsharp20/drive_c/users/root/Temp:rw,exec,nosuid,nodev,size=256m,mode=1777
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      JSharp__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      JSharp__WorkerImageId: ${SHARPLABNEXT_JSHARP_IMAGE_ID:-unverified}

  worker-il:
    <<: *service-defaults
    image: ${SHARPLABNEXT_IL_WORKER_IMAGE:-sharplabnext/worker-il:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      IlWorker__ReleaseId: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      IlWorker__WorkerImageId: ${SHARPLABNEXT_IL_WORKER_IMAGE_ID:-unverified}
      ArtifactStore__BaseUrl: http://artifact-store:8080
      IlWorker__DevelopmentArtifactEnvelope__Enabled: "false"
      ReferenceSets__net10-ref__Path: /reference-sets/net10-ref
      ReferenceSets__net11-preview-ref__Path: /reference-sets/net11-preview-ref

  worker-minilang:
    <<: *service-defaults
    image: ${SHARPLABNEXT_MINILANG_IMAGE:-sharplabnext/worker-minilang:0.1.0-dev.1}
    environment:
      <<: *service-environment
      ReferenceSetAttestation__Required: "true"
      MINILANG_RELEASE_ID: ${SHARPLABNEXT_RELEASE_ID:-0.1.0-dev.1}
      MINILANG_WORKER_IMAGE_ID: ${SHARPLABNEXT_MINILANG_IMAGE_ID:-unverified}

networks:
  public:
    driver: bridge
  control:
    driver: bridge
    internal: true
  cppcli-control:
    driver: bridge
    internal: true
  jsharp-control:
    driver: bridge
    internal: true

volumes:
  artifact-data:

secrets:
  internal-service-token:
    file: ${SHARPLABNEXT_INTERNAL_SERVICE_TOKEN_FILE:-./secrets/internal-service-token}
  github-oauth-client-secret:
    file: ${SHARPLABNEXT_GITHUB_OAUTH_CLIENT_SECRET_FILE:-./github-oauth-client-secret.disabled}
